<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Gallery | Andre Portfolio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Lora:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="sidebar.css">
  <style>
    * { box-sizing: border-box; }

    body {
      display: flex;
      min-height: 100vh;
      margin: 0;
      background: var(--theme-blush);
      color: var(--theme-ink);
      font-family: "Absans", sans-serif;
    }

    .gallery {
      flex: 1;
      min-width: 0;
      padding: clamp(2rem, 5vw, 5rem);
    }

    .artwork-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 2.5rem 1.75rem;
      margin-top: 2.5rem;
    }

    .gallery-header {
      grid-column: 1 / -1;
      margin-bottom: 0.5rem;
    }

    .gallery-header p {
      margin: 0 0 0.75rem;
      color: var(--theme-rose);
      font-size: 0.8rem;
      letter-spacing: 0.14em;
      text-transform: uppercase;
    }

    .gallery h2 {
      margin: 0;
      font-family: "Lora", Georgia, serif;
      font-size: clamp(2.8rem, 5vw, 4.5rem);
      font-weight: 500;
      letter-spacing: -0.05em;
      line-height: 1;
    }

    .gallery-header .intro {
      max-width: 34rem;
      margin: 1rem 0 0;
      color: var(--theme-muted);
      font-size: 1.05rem;
      letter-spacing: 0;
      line-height: 1.65;
      text-transform: none;
    }

    .gallery-item {
      position: relative;
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
      width: 100%;
      padding: 0 0 1rem;
      color: inherit;
      font: inherit;
      text-align: left;
      cursor: zoom-in;
      transition: transform 180ms ease;
    }

    .gallery-item:hover { transform: translateY(-3px); }

    .gallery-item:focus-visible {
      outline: 3px solid var(--theme-magenta);
      outline-offset: 4px;
    }

    .gallery-item h3 {
      margin: 0;
      color: var(--theme-ink);
      font-family: "Absans", sans-serif;
      font-size: clamp(1.15rem, 1.5vw, 1.4rem);
      font-weight: 700;
      letter-spacing: 0.01em;
    }

    .image-frame {
      position: relative;
      display: block;
      overflow: hidden;
      border-radius: 4px;
    }

    .image-frame img {
      display: block;
      width: 100%;
      aspect-ratio: 4 / 3;
      object-fit: cover;
    }

    .image-details {
      position: absolute;
      right: 0;
      bottom: 0;
      left: 0;
      padding: 2.5rem 1rem 1rem;
      background: linear-gradient(transparent, var(--theme-image-scrim));
      color: var(--theme-white);
      font-size: 0.95rem;
      letter-spacing: 0.02em;
      opacity: 0;
      transform: translateY(0.5rem);
      transition: opacity 180ms ease, transform 180ms ease;
    }

    .gallery-item:hover .image-details,
    .gallery-item:focus-visible .image-details {
      opacity: 1;
      transform: translateY(0);
    }

    .project-section {
      min-width: 0;
      margin-top: 0.5rem;
      padding-top: 2rem;
      border-top: 1px solid var(--theme-divider-soft);
    }

    .project-groups {
      display: grid;
      gap: 2rem;
      margin-top: 3rem;
    }

    .gallery .project-heading {
      margin: 0 0 1.5rem;
      padding: 0.75rem 1rem;
      background: var(--theme-blush);
      font-family: "Lora", Georgia, serif;
      font-size: clamp(1.6rem, 2.3vw, 2.1rem);
      font-weight: 700;
      letter-spacing: -0.035em;
    }

    .project-strip {
      display: flex;
      gap: 1.25rem;
      overflow-x: auto;
      padding: 0.25rem 0 1rem;
      scroll-snap-type: x mandatory;
      scrollbar-color: var(--theme-magenta) var(--theme-scroll-track);
      scrollbar-width: thin;
    }

    .project-strip .gallery-item {
      flex: 0 0 clamp(240px, 32%, 380px);
      scroll-snap-align: start;
    }

    .image-popup {
      width: min(90vw, 1100px);
      max-width: none;
      max-height: 90vh;
      padding: 1.5rem;
      border: 0;
      background: var(--theme-white);
      color: var(--theme-ink);
    }

    .image-popup::backdrop { background: var(--theme-image-scrim); }

    .popup-close {
      display: block;
      margin: 0 0 1rem auto;
      padding: 0.5rem 0.9rem;
      border: 0;
      background: var(--theme-magenta);
      color: var(--theme-ink);
      font: inherit;
      cursor: pointer;
    }

    .image-popup h2 {
      margin: 0 0 1rem;
      font-family: "Lora", Georgia, serif;
      font-size: clamp(1.5rem, 3vw, 2.25rem);
      font-weight: 500;
    }

    .image-popup p {
      max-width: 42rem;
      margin: 0 0 1.25rem;
      color: var(--theme-muted);
      line-height: 1.6;
    }

    .image-popup img {
      display: block;
      max-width: 100%;
      max-height: calc(90vh - 8rem);
      margin: 0 auto;
      object-fit: contain;
    }

    @media (max-width: 640px) {
      body { display: block; }

      .gallery { padding: 1.5rem; }
      .artwork-grid { grid-template-columns: 1fr; }
      .project-strip .gallery-item { flex-basis: 82%; }
    }
  </style>
</head>
<body id="top">
  <aside class="sidebar" aria-label="Main sidebar">
    <h1><a href="index.html#top">Andre Bastian Ibarguengoitia</a></h1>
    <nav aria-label="Main navigation">
      <a href="index.html#top">Main</a>
      <a href="gallery.html" aria-current="page">Gallery</a>
      <!-- <a href="index.html#projects">Projects</a> -->
      <a href="about.html">About</a>
      <a href="contact.html">Contact</a>
    </nav>
  </aside>

  <main class="gallery" aria-label="Gallery">
    <header class="gallery-header">
      <p>Selected work</p>
      <h2>Gallery</h2>
      <p class="intro">Textile studies, material experiments, and work in space.</p>
    </header>
    <div class="artwork-grid" id="artwork-grid" aria-label="Artwork"></div>
    <div class="project-groups" id="project-groups"></div>
  </main>

  <dialog class="image-popup" aria-labelledby="popup-title" aria-describedby="popup-description">
    <button class="popup-close" type="button" aria-label="Close image popup">Close</button>
    <h2 id="popup-title"></h2>
    <p id="popup-description"></p>
    <img src="images/andre-artwork.jpeg" alt="">
  </dialog>

  <script src="artwork-data.js"></script>
  <script>
    const imagePopup = document.querySelector(".image-popup");
    const popupClose = document.querySelector(".popup-close");
    const popupTitle = document.querySelector("#popup-title");
    const popupDescription = document.querySelector("#popup-description");
    const popupImage = imagePopup.querySelector("img");

    function createArtworkCard(artwork) {
      const card = document.createElement("div");
      card.className = "gallery-item";
      card.setAttribute("role", "button");
      card.setAttribute("tabindex", "0");
      card.setAttribute("aria-haspopup", "dialog");
      card.setAttribute("aria-label", `Open ${artwork.title}`);
      card.dataset.description = artwork.description;

      const title = document.createElement("h3");
      title.textContent = artwork.title;

      const frame = document.createElement("div");
      frame.className = "image-frame";

      const image = document.createElement("img");
      image.src = artwork.src;
      image.alt = artwork.alt;

      const details = document.createElement("span");
      details.className = "image-details";
      details.textContent = `${artwork.year} · ${artwork.medium}`;

      frame.append(image, details);
      card.append(title, frame);
      card.addEventListener("click", () => openImagePopup(card));
      card.addEventListener("keydown", (event) => {
        if (event.key === "Enter" || event.key === " ") {
          event.preventDefault();
          openImagePopup(card);
        }
      });
      return card;
    }

    function openImagePopup(galleryItem) {
      const image = galleryItem.querySelector("img");
      popupTitle.textContent = galleryItem.querySelector("h3").textContent;
      popupDescription.textContent = galleryItem.dataset.description;
      popupImage.src = image.src;
      popupImage.alt = image.alt;
      imagePopup.showModal();
    }

    const artworksById = new Map(window.portfolioArtworks.map((artwork) => [artwork.id, artwork]));
    const artworkGrid = document.querySelector("#artwork-grid");
    const projectGroups = document.querySelector("#project-groups");

    window.portfolioArtworks.forEach((artwork) => {
      artworkGrid.append(createArtworkCard(artwork));
    });

    window.portfolioProjects.forEach((project, index) => {
      const section = document.createElement("section");
      section.className = "project-section";
      section.setAttribute("aria-labelledby", `project-title-${index}`);

      const title = document.createElement("h2");
      title.className = "project-heading";
      title.id = `project-title-${index}`;
      title.textContent = project.title;

      const strip = document.createElement("div");
      strip.className = "project-strip";
      strip.setAttribute("aria-label", `Scrollable images from ${project.title}`);

      project.artworkIds
        .map((id) => artworksById.get(id))
        .filter(Boolean)
        .forEach((artwork) => strip.append(createArtworkCard(artwork)));

      section.append(title, strip);
      projectGroups.append(section);
    });
    popupClose.addEventListener("click", () => imagePopup.close());
    imagePopup.addEventListener("click", (event) => {
      if (event.target === imagePopup) imagePopup.close();
    });
  </script>
</body>
</html>
